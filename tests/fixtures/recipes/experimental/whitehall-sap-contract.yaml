# Experimental only. Not enabled in daily runs and not production source support.
source_name: Whitehall Resources SAP Jobs (experimental)
start_url: https://www.whitehallresources.com/sap-jobs/
mode: static_html

listing:
  card_selector: div.job-item
  title_selector:
    - h3 a
    - h2 a
    - .job-title a
    - .job-title
  link_selector:
    - h3 a
    - h2 a
    - .job-title a
    - a.button.view
    - .job-title
  location_selector:
    - .job-location
    - .location
  remote_selector:
    - .job-arrangement
  workload_selector:
    - .job-type
  posted_date_selector:
    - time
    - .posted-date
  description_selector:
    - .job-summary
    - .summary

accept:
  url_contains:
    - /job/

detail:
  follow: true
  use_json_ld: true
  title_selector:
    - .job-single h1
    - main h1
    - h1
  location_selector:
    - .job-single .left-col .job-details .job-location
    - .job-single .job-location
  workload_selector:
    - .job-single .left-col .job-type
    - .job-single .job-type
  # Review/compatibility proof cap. Actual source runs enrich every retained listing URL.
  max_detail_pages: 5
  request_delay_seconds: 1.0

pagination:
  page_link_selector: a.page-numbers
  next_selector: a.next.page-numbers
  max_pages: 4
  request_delay_seconds: 1.0

reject:
  title_exact:
    - Apply
    - Apply now
    - More info
    - View Job
    - Services
    - Job Search
  title_contains:
    - Upload SAP Job
    - Improve my CV
    - SAP job vacancies
  url_contains:
    - /services
    - /about
    - /contact
    - /candidates
    - /clients
    - /category
    - /blog
    - /sap-jobs/?
    - '#job-application'

patterns:
  job_id_regex: "(?:Job ID|Ref):\\s*(?P<job_id>BBBH[0-9_]+)"
  remote_regex: "\\b(?P<remote>Remote|Hybrid|Hybrid-remote|Office based)\\b"
  work_type_regex: "\\b(?P<work_type>Contract|Freelance|Permanent)\\b"
  start_date_regex: "Start:\\s*(?P<start_date>[^*\\n\\r]+?)(?=\\s+\\*|\\s+Duration:|$)"
  language_regex: "(?:Languages?:\\s*|Fluent in\\s+)(?P<language>English(?:\\s*\\([^)]*\\))?(?:\\s*(?:&|and)\\s*Swedish)?|[A-Z][A-Za-z]+(?:\\s*\\([^)]*\\))?)"

limits:
  max_cards: 25
  min_title_length: 8
  min_description_length: 0
