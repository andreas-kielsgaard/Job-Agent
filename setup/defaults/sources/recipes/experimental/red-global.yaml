source_name: RED Global
start_url: https://www.redglobal.com/jobs/search?keywords=&role=H021HnPu&workplace=&types=
mode: static_html
listing:
  card_selector: div.c-card-job__content
  title_selector: a.c-card-job__title[href*="/job/"]
  link_selector: a.c-card-job__title[href*="/job/"]
accept:
  url_contains:
  - /job/
reject:
  title_exact:
  - Apply
  - Apply now
  - More info
  - View Job
  - Services
  - Job Search
  title_contains:
  - Upload SAP Job
  - Improve my CV
  url_contains:
  - /services
  - /about
  - /contact
  - /candidates
  - /clients
  - /category
  - /blog
  - '#'
patterns:
  job_id_regex: (?:Job ID|Ref):\s*(?P<job_id>[A-Za-z0-9_/-]+)
  remote_regex: \b(?P<remote>Remote|Hybrid|Hybrid-remote|Office based|On-site|\d+%\s*remote)\b
  work_type_regex: \b(?P<work_type>Contract|Freelance|Permanent)\b
  start_date_regex: '(?:Start(?: date)?\s*:?\s*)(?P<start_date>asap|\d{1,2}\s*/\s*\d{4}|\d{1,2}[./]\d{1,2}[./]\d{4}|[^*\n\r]+?)(?=\s+Duration\b|\s+\d+\s*%\s*workload\b|\s+End
    date:|$)'
  language_regex: (?:Languages?:\s*|Language skills:\s*|Fluent in\s+)(?P<language>[A-Z][A-Za-z]+(?:\s*\([^)]*\))?)
limits:
  max_cards: 25
  min_title_length: 8
  min_description_length: 0
pagination:
  strategy: url
  page_link_selector: a[href*="page="]
  next_selector: ''
  max_pages: 6
  request_delay_seconds: 1.0
detail:
  follow: true
  max_detail_pages: 5
  request_delay_seconds: 1.0
  title_selector:
  - main h1
  - h1
  location_selector: div.c-card-job__content:nth-of-type(1) > p:nth-of-type(1)
