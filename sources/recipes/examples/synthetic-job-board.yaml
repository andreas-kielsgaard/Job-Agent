source_name: Synthetic Example Job Board
start_url: https://example.com/jobs

listing:
  card_selector: .job-card
  title_selector: .job-title
  link_selector: .job-title
  company_selector: .company
  location_selector: .location
  rate_selector: .rate
  workload_selector: .workload
  posted_date_selector: .posted
  description_selector: .summary

detail:
  follow: false
  max_detail_pages: 5

reject:
  title_exact:
    - Apply
    - Apply now
    - More info
    - Services
  title_contains:
    - Upload SAP Job
    - Job Search
  url_contains:
    - /services
    - /about
    - /contact

limits:
  max_cards: 25
  min_title_length: 8
  min_description_length: 0
