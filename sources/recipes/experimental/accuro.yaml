source_name: Accuro
start_url: https://accuro.dk/en/consultant/freelance-projects/
mode: static_html
listing:
  card_selector: tbody tr
  title_selector: td:nth-of-type(1) a[href*="/freelance_projects/"]
  link_selector: td:nth-of-type(1) a[href*="/freelance_projects/"]
  location_selector: td:nth-of-type(3)
  workload_selector: td:nth-of-type(2)
  posted_date_selector: td:nth-of-type(4)
accept:
  url_contains:
  - /freelance_projects/
reject:
  title_exact:
  - Apply
  - Apply now
  - More info
  - View Job
  - Services
  - Job Search
  title_contains:
  - Upload SAP Job
  - Improve my CV
  url_contains:
  - /services
  - /about
  - /contact
  - /candidates
  - /clients
  - /category
  - /blog
  - '#'
patterns:
  job_id_regex: (?:Job ID|Ref):\s*(?P<job_id>[A-Za-z0-9_/-]+)
  remote_regex: \b(?P<remote>Remote|Hybrid|Hybrid-remote|Office based|On-site|\d+%\s*remote)\b
  work_type_regex: \b(?P<work_type>Contract|Freelance|Permanent)\b
  start_date_regex: '(?:Start(?: date)?\s*:?\s*)(?P<start_date>asap|\d{1,2}\s*/\s*\d{4}|\d{1,2}[./]\d{1,2}[./]\d{4}|[^*\n\r]+?)(?=\s+Duration\b|\s+\d+\s*%\s*workload\b|\s+End
    date:|$)'
  language_regex: (?:Languages?:\s*|Language skills:\s*|Fluent in\s+)(?P<language>[A-Z][A-Za-z]+(?:\s*\([^)]*\))?)
limits:
  max_cards: 25
  min_title_length: 8
  min_description_length: 0
detail:
  follow: true
  max_detail_pages: 5
  request_delay_seconds: 1.0
  use_json_ld: true
  title_selector:
  - h1
  description_selector: .job_txt_wrapp .des_wrapp
  location_selector: .dato_wrapp
