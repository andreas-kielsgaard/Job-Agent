# Experimental only. Not enabled in daily runs and not production source support.
source_name: Montreal Associates Job Search (experimental)
start_url: https://www.montrealassociates.com/uk/candidates/job-search/
mode: rendered_html

listing:
  card_selector: li.job-data
  title_selector:
    - .xs-heading span
  link_selector:
    - a[href*="/uk/candidates/job/"]
    - a
  location_selector:
    - .job-data-highlights li:nth-of-type(2) span
  rate_selector:
    - .job-data-highlights li:nth-of-type(1) span
  workload_selector:
    - .job-data-highlights li:nth-of-type(3) span
  posted_date_selector:
    - .post-date
  description_selector:
    - p

accept:
  url_contains:
    - /uk/candidates/job/

detail:
  follow: false
  max_detail_pages: 5

reject:
  title_exact:
    - Apply
    - Apply now
    - More info
    - Services
    - Job Search
    - Work with MA
  title_contains:
    - Contract Staffing
    - Contract Insights
    - Our Locations
    - Upload SAP Job
    - Improve my CV
  url_contains:
    - /staffing-solutions/
    - /resources/
    - /markets-page/
    - /services
    - /about
    - /contact
    - /category
    - /blog
    - '#'

patterns:
  job_id_regex: "(?P<job_id>006P[0-9A-Za-z_]+)"

limits:
  max_cards: 25
  min_title_length: 8
  min_description_length: 0
