[project]
name = "job-agent"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app/code"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "B008", # FastAPI intentionally uses Form/File/Query marker calls as defaults.
  "E501", # The app has long prompt/help strings; formatter handles normal wrapping.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not exploratory'"
pythonpath = ["app/code"]
markers = [
  "exploratory: development-only probes for source recipes and feature exploration; excluded from the product verification suite.",
]

[tool.coverage.run]
branch = true
source = ["app/code/job_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0
