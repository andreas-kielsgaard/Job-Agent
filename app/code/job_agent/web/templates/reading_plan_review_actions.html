{% for action in reading_plan_review.actions %}
  {% if action.type == "form" %}
  <form method="{{ action.method or 'post' }}" action="{{ action.action }}" class="inline-form">
    {% for field in action.fields %}
    <input type="hidden" name="{{ field.name }}" value="{{ field.value }}">
    {% endfor %}
    <button type="submit" class="{{ action.button_class or 'button' }}">{{ action.label }}</button>
  </form>
  {% elif action.type == "link" %}
  <a class="{{ action.button_class or 'button light' }}" href="{{ action.href }}">{{ action.label }}</a>
  {% endif %}
{% endfor %}
